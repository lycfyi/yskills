name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install pyyaml
        run: pip install pyyaml

      - name: Validate skills against the Agent Skills spec
        run: python3 scripts/validate.py

      - name: Validate plugin, marketplace and hook manifests
        run: |
          for f in .claude-plugin/plugin.json .claude-plugin/marketplace.json hooks/hooks.json \
                   mods/hud/.claude-plugin/plugin.json mods/hud/hooks/hooks.json; do
            python3 -c "import json, sys; json.load(open(sys.argv[1]))" "$f" || exit 1
          done

      - name: Shellcheck the scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck --severity=error install.sh scripts/*.sh skills/*/scripts/*.sh hooks/*.sh

      - name: Test the idle-return hook
        run: scripts/test-idle-return.sh

      - name: Package skills
        run: scripts/package.sh
